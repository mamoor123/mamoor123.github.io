<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Mamoor Ahmad</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .error-page__code {
      font-family: var(--font-mono);
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0.8;
    }
    .error-page__title {
      font-family: var(--font-mono);
      font-size: clamp(1.25rem, 3vw, 2rem);
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-page__desc {
      color: var(--text-secondary);
      font-size: 1.0625rem;
      margin-bottom: 32px;
      max-width: 480px;
    }
    .error-page__actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-page__code">404</div>
      <h1 class="error-page__title">Page Not Found</h1>
      <p class="error-page__desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="error-page__actions">
        <a href="index.html" class="btn btn--primary btn--lg">← Back to Home</a>
        <a href="projects.html" class="btn btn--outline btn--lg">View Projects</a>
      </div>
    </div>
  </div>
</body>
</html>
