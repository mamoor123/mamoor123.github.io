      { id: 20, icon: '🎧', name: 'AI Support Agent', category: 'ai', lang: 'Python/TS', desc: 'AI Customer Support Agent', stars: null, url: 'https://github.com/mamoor123/ai-support-agent', status: 'github' },
      { id: 21, icon: '🔗', name: 'BioLink AI', category: 'saas', lang: 'TypeScript', desc: 'AI-powered Bio Link Builder', stars: null, url: 'https://github.com/mamoor123/biolink-ai', status: 'github' },
      { id: 22, icon: '🌉', name: 'CBAM Bridge', category: 'climate', lang: 'Python', desc: 'EU Carbon compliance for exporters', stars: null, url: 'https://github.com/mamoor123/cbam-bridge', status: 'github' },
      { id: 23, icon: '📝', name: 'EasyForm', category: 'saas', lang: 'TypeScript', desc: 'Modern form builder SaaS', stars: null, url: 'https://easyform-two.vercel.app', status: 'live' },
      { id: 24, icon: '📈', name: 'My Trade SaaS', category: 'saas', lang: 'TypeScript', desc: 'Full-stack trading platform', stars: null, url: 'https://my-trade-saas.vercel.app', status: 'live' },
      { id: 25, icon: '⭐', name: 'ReviewReply', category: 'saas', lang: 'JavaScript', desc: 'AI Google review reply tool', stars: null, url: 'https://github.com/mamoor123/reviewreply', status: 'github' },
      { id: 26, icon: '📸', name: 'SnapPost', category: 'devtools', lang: 'CSS/HTML/JS', desc: 'Screenshot to social media post', stars: null, url: 'https://github.com/mamoor123/snap-post', status: 'github' },
      { id: 27, icon: '🔍', name: 'ReverseSearch Engine', category: 'saas', lang: 'TypeScript', desc: 'Demand-driven marketplace', stars: null, url: 'https://github.com/mamoor123/ReverseSearch-Engine', status: 'github' },
      { id: 28, icon: '🔎', name: 'ScreenSync', category: 'devtools', lang: 'JavaScript', desc: 'OFAC/EU/UN sanctions checker', stars: null, url: 'https://github.com/mamoor123/screensync-v1', status: 'github' },
      { id: 29, icon: '📄', name: 'Proposal Generator', category: 'saas', lang: 'TypeScript', desc: 'Freelancer proposals → PDF → Stripe', stars: null, url: 'https://github.com/mamoor123/proposal-generator', status: 'github' },
      { id: 30, icon: '🏷️', name: 'HS Code Classifier', category: 'saas', lang: 'JavaScript', desc: 'Instant HS code classification API', stars: null, url: 'https://github.com/mamoor123/hs-code-classifier', status: 'github' },
      { id: 31, icon: '✨', name: 'AgentDNA Luxury Prototype', category: 'ai', lang: 'Python', desc: 'Luxury Concierge AI Prototype', stars: null, url: 'https://github.com/mamoor123/agentdna_luxury_prototype', status: 'github' }
    ];

    const langColors = {
      'JavaScript': '#f1e05a',
      'TypeScript': '#3178c6',
      'Python': '#3572A5',
      'HTML': '#e34c26',
      'CSS/HTML/JS': '#563d7c',
      'Python/TS': '#3572A5'
    };

    const categoryLabels = {
      'ai': 'AI & Agents',
      'saas': 'SaaS',
      'climate': 'Climate',
      'devtools': 'Dev Tools',
      'other': 'Other'
    };

    const grid = document.getElementById('projects-grid');
    const pills = document.querySelectorAll('.filter-pill');
    const searchInput = document.querySelector('.filter-search__input');
    const countEl = document.querySelector('.filter-count');
    let activeFilter = 'all';
    let searchQuery = '';

    function createCard(p) {
      const card = document.createElement('article');
      card.className = 'project-card--sm';
      card.setAttribute('role', 'listitem');
      card.setAttribute('data-category', p.category);
      card.innerHTML = `
        <div class="project-card--sm__header">
          <span class="project-card--sm__icon" aria-hidden="true">${p.icon}</span>
          <span class="project-card--sm__status project-card--sm__status--${p.status}">${p.status === 'live' ? '● Live' : '◆ GitHub'}</span>
        </div>
        <h2 class="project-card--sm__title">${p.name}</h2>
        <p class="project-card--sm__desc">${p.desc}</p>
        <div class="project-card--sm__meta">
          <span class="project-card--sm__lang">
            <span class="project-card--sm__lang-dot" style="background:${langColors[p.lang] || '#888'}"></span>
            ${p.lang}
          </span>
          ${p.stars ? `<span class="project-card--sm__stars">⭐ ${p.stars}</span>` : ''}
        </div>
        <div class="project-card--sm__tags">
          <span class="tag">${categoryLabels[p.category]}</span>
          <span class="tag">${p.lang}</span>
        </div>
        <div class="project-card--sm__footer">
          <a href="${p.url}" class="project-card--sm__link" target="_blank" rel="noopener">
            ${p.status === 'live' ? 'Live Demo' : 'View Code'} →
          </a>
          <span class="project-card--sm__category">${categoryLabels[p.category]}</span>
        </div>
      `;
      return card;
    }

    function render() {
      const filtered = projects.filter(p => {
        const matchCategory = activeFilter === 'all' || p.category === activeFilter;
        const matchSearch = !searchQuery ||
          p.name.toLowerCase().includes(searchQuery) ||
          p.desc.toLowerCase().includes(searchQuery) ||
          p.lang.toLowerCase().includes(searchQuery) ||
          categoryLabels[p.category].toLowerCase().includes(searchQuery);
        return matchCategory && matchSearch;
      });

      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="no-results">
            <div class="no-results__icon">🔍</div>
            <p class="no-results__text">No projects found matching your criteria.</p>
          </div>
        `;
      } else {
        filtered.forEach(p => grid.appendChild(createCard(p)));
      }

      countEl.textContent = `${filtered.length} project${filtered.length !== 1 ? 's' : ''}`;

      // GSAP animate new cards
      if (typeof gsap !== 'undefined' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        gsap.from('.project-card--sm', {
          opacity: 0,
          y: 20,
          duration: 0.4,
          stagger: 0.05,
          ease: 'power2.out'
        });
      }
    }

    // Filter pills
    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => {
          p.classList.remove('active');
          p.setAttribute('aria-selected', 'false');
        });
        pill.classList.add('active');
        pill.setAttribute('aria-selected', 'true');
        activeFilter = pill.getAttribute('data-filter');
        render();
      });
    });

    // Search
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = searchInput.value.toLowerCase().trim();
        render();
      }, 200);
    });

    // Keyboard shortcut: / to focus search
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        searchQuery = '';
        render();
        searchInput.blur();
      }
    });

    // Initial render
    render();
  })();
  </script>
